# MuJoCo deployment settings for the Go2 body-frame velocity policy, read by
# policy_node. The policy, world and map paths are ROS parameters (see the launch file).

# Simulator settings applied to the loaded model; they must match training.
simulation_dt: 0.005
control_decimation: 4
integrator: implicitfast
solver: newton
solver_iterations: 100
line_search_iterations: 50

# Position PD used by source/go2_rl_lab/go2_rl_lab/assets/go2.py.
kps: [25.0, 25.0, 25.0, 25.0, 25.0, 25.0, 25.0, 25.0, 25.0, 25.0, 25.0, 25.0]
kds: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5]

# Go2HV torque-speed envelope used by the training actuator.
motor:
  use_torque_speed_curve: true
  X1: 13.5
  X2: 30.0
  Y1: 20.2
  Y2: 23.4

default_angles: [0.1, 0.8, -1.5, -0.1, 0.8, -1.5, 0.1, 1.0, -1.5, -0.1, 1.0, -1.5]

# One 45-dimensional frame is passed to policy.pt. The exported module maintains
# the 10-frame observation history internally.
ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
command_scale: [0.5, 1.0, 1.0]
action_scale: 0.25
action_clip: 100.0
num_actions: 12
num_obs: 45

mujoco_joint_names:
  - FL_hip_joint
  - FL_thigh_joint
  - FL_calf_joint
  - FR_hip_joint
  - FR_thigh_joint
  - FR_calf_joint
  - RL_hip_joint
  - RL_thigh_joint
  - RL_calf_joint
  - RR_hip_joint
  - RR_thigh_joint
  - RR_calf_joint

policy_joint_names:
  - FL_hip_joint
  - FL_thigh_joint
  - FL_calf_joint
  - FR_hip_joint
  - FR_thigh_joint
  - FR_calf_joint
  - RL_hip_joint
  - RL_thigh_joint
  - RL_calf_joint
  - RR_hip_joint
  - RR_thigh_joint
  - RR_calf_joint
